<?xml version="1.0" encoding="UTF-8"?>
<!--
  NanoBrew Café: chibi character template, vector illustration style.
  Office worker (customer) facing down-right (SE), with the Clerkbot (Synth) parts
  as hidden layers. Open in Inkscape (free): each part is its own layer.

  Canvas 256 x 440 = 4x the in-game size (64 x 110 px). Pivot: between the feet,
  at (128, 430). See the hidden "guides" layer and docs/art-guide.md.

  Style rules used here:
  - Clean vector shapes, rounded joins, no pure-black outline: each shape is outlined
    in a darker shade of its own colour (4 px at this scale).
  - One soft gradient per material (light from the top-left) plus one cel-shadow shape.
  - A cyan neon rim light on the right edge (the city outside the window).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="256" height="440" viewBox="0 0 256 440">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3c8"/>
      <stop offset="1" stop-color="#f4b994"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4a3a"/>
      <stop offset="1" stop-color="#3e2a22"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a74c4"/>
      <stop offset="1" stop-color="#2f3f7c"/>
    </linearGradient>
    <linearGradient id="trousers" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f5c"/>
      <stop offset="1" stop-color="#23263a"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a6a44"/>
      <stop offset="1" stop-color="#5e3d26"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ff3ff"/>
      <stop offset="0.5" stop-color="#4fb3ff"/>
      <stop offset="1" stop-color="#2a6fd6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e8f2"/>
      <stop offset="1" stop-color="#8d96ab"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fb3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4fb3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g inkscape:groupmode="layer" inkscape:label="guides (hidden)" id="guides" style="display:none">
    <rect x="96" y="0" width="64" height="440" fill="none" stroke="#ff4fd8" stroke-dasharray="6 6"/>
    <line x1="108" y1="430" x2="148" y2="430" stroke="#ff4fd8" stroke-width="2"/>
    <line x1="128" y1="410" x2="128" y2="440" stroke="#ff4fd8" stroke-width="2"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="synth_glow (Synth only)" id="synth_glow" style="display:none">
    <ellipse cx="128" cy="300" rx="128" ry="150" fill="url(#glow)"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="shadow" id="shadow">
    <ellipse cx="130" cy="425" rx="72" ry="15" fill="#000" opacity="0.22"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="leg_back" id="leg_back" stroke-linejoin="round">
    <rect x="98" y="336" width="30" height="76" rx="13" fill="url(#trousers)" stroke="#191b2a" stroke-width="4"/>
    <ellipse cx="110" cy="414" rx="22" ry="11" fill="#22202e" stroke="#121019" stroke-width="4"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="arm_back" id="arm_back" stroke-linejoin="round">
    <rect x="58" y="258" width="28" height="80" rx="14" fill="#2f3f7c" stroke="#1e2852" stroke-width="4" transform="rotate(8 72 258)"/>
    <circle cx="66" cy="342" r="14" fill="url(#skin)" stroke="#c98a68" stroke-width="4"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="leg_front" id="leg_front" stroke-linejoin="round">
    <rect x="134" y="338" width="32" height="78" rx="14" fill="url(#trousers)" stroke="#191b2a" stroke-width="4"/>
    <ellipse cx="154" cy="418" rx="24" ry="12" fill="#22202e" stroke="#121019" stroke-width="4"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="torso" id="torso" stroke-linejoin="round">
    <path d="M78,250 Q128,230 182,250 L196,346 Q128,364 62,346 Z" fill="url(#jacket)" stroke="#1e2852" stroke-width="4"/>
    <!-- cel shadow under the arm and along the far side -->
    <path d="M78,250 Q74,300 66,344 Q86,352 104,355 Q92,300 96,252 Z" fill="#1e2852" opacity="0.35"/>
    <path d="M108,246 L128,292 L150,246 Q128,238 108,246 Z" fill="#f4f6fb" stroke="#b9c0d6" stroke-width="3"/>
    <path d="M123,262 L134,262 L139,312 L128,326 L118,312 Z" fill="#e3485a" stroke="#9c2434" stroke-width="3"/>
    <!-- neon rim light on the right edge -->
    <path d="M184,262 L194,340" stroke="#38e1ff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="arm_front (customer)" id="arm_front" stroke-linejoin="round">
    <rect x="176" y="258" width="30" height="82" rx="15" fill="url(#jacket)" stroke="#1e2852" stroke-width="4" transform="rotate(-6 191 258)"/>
    <circle cx="198" cy="344" r="15" fill="url(#skin)" stroke="#c98a68" stroke-width="4"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="prop_briefcase (customer)" id="prop_briefcase" stroke-linejoin="round">
    <path d="M186,338 Q198,322 212,338" fill="none" stroke="#3e2a1c" stroke-width="5" stroke-linecap="round"/>
    <rect x="170" y="340" width="60" height="44" rx="7" fill="url(#leather)" stroke="#3e2a1c" stroke-width="4"/>
    <rect x="196" y="352" width="10" height="8" rx="2" fill="#f2c94c"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="synth_arm (Synth only, replaces arm_front)" id="synth_arm" style="display:none" stroke-linejoin="round">
    <rect x="178" y="256" width="28" height="44" rx="10" fill="url(#metal)" stroke="#5b647a" stroke-width="4"/>
    <circle cx="192" cy="304" r="11" fill="#4fb3ff" stroke="#2a6fd6" stroke-width="4"/>
    <rect x="182" y="306" width="22" height="36" rx="8" fill="url(#metal)" stroke="#5b647a" stroke-width="4"/>
    <path d="M182,342 l-6,14 M193,344 l0,16 M204,342 l6,14" stroke="#5b647a" stroke-width="6" stroke-linecap="round"/>
    <path d="M200,262 L200,296" stroke="#38e1ff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="head" id="head" stroke-linejoin="round">
    <ellipse cx="54" cy="166" rx="16" ry="20" fill="url(#skin)" stroke="#c98a68" stroke-width="4"/>
    <ellipse cx="130" cy="152" rx="92" ry="88" fill="url(#skin)" stroke="#c98a68" stroke-width="4"/>
    <!-- cel shadow on the far cheek and under the hair -->
    <path d="M44,150 Q44,215 92,236 Q60,200 66,150 Z" fill="#e7a07c" opacity="0.45"/>
    <path d="M214,120 Q226,160 212,198" stroke="#38e1ff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="face_neutral" id="face" stroke-linejoin="round">
    <ellipse cx="118" cy="166" rx="12" ry="18" fill="#2b2238"/>
    <ellipse cx="176" cy="164" rx="14" ry="19" fill="#2b2238"/>
    <circle cx="122" cy="158" r="5" fill="#fff"/>
    <circle cx="181" cy="156" r="5.5" fill="#fff"/>
    <ellipse cx="100" cy="196" rx="13" ry="7" fill="#ff8fa3" opacity="0.55"/>
    <ellipse cx="196" cy="194" rx="14" ry="7" fill="#ff8fa3" opacity="0.55"/>
    <path d="M140,204 Q151,214 162,203" fill="none" stroke="#7a3b3b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="hair" id="hair" stroke-linejoin="round">
    <path d="M38,162 C28,84 88,46 140,50 C200,54 234,98 222,152 C204,122 164,104 122,110 C96,114 72,128 62,166 Z"
          fill="url(#hair)" stroke="#2a1b15" stroke-width="4"/>
    <path d="M150,62 C178,66 204,86 210,112" stroke="#a37a62" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="synth_visor (Synth only)" id="synth_visor" style="display:none" stroke-linejoin="round">
    <rect x="88" y="144" width="122" height="40" rx="18" fill="url(#visor)" stroke="#1f4fa8" stroke-width="4"/>
    <path d="M100,154 L150,154" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <rect x="44" y="150" width="20" height="30" rx="6" fill="url(#metal)" stroke="#5b647a" stroke-width="4"/>
  </g>
</svg>
